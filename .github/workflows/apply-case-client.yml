name: Apply case shop client patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[case-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch localscript.lua
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('localscript.lua')
          s = p.read_text(encoding='utf-8')

          if 'CASE_CLIENT_V2' in s:
              print('Already patched')
              raise SystemExit(0)

          anchor = 'local requestOwnedItemsEvent = ReplicatedStorage:WaitForChild("RequestOwnedItemsEvent")'
          event_line = 'local openCaseEvent = ReplicatedStorage:WaitForChild("OpenCase")'
          if event_line not in s:
              if anchor not in s:
                  raise SystemExit('Event anchor not found')
              s = s.replace(anchor, anchor + '\n' + event_line, 1)

          s = s.replace('local currentShopTab = "Weapons"', 'local currentShopTab = "Cases"', 1)
          s = s.replace('createShopTab("Weapons", "Guns", "Weapons")', 'createShopTab("Cases", "Cases", "Cases")', 1)

          start = s.find('\n\tif currentShopTab == "Weapons" then')
          marker = '\n\t-- Варианты дэша'
          end = s.find(marker, start)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Weapons block not found')

          case_block = r'''
	if currentShopTab == "Cases" then
		local caseCard = Instance.new("Frame")
		caseCard.Name = "CaseCard"
		caseCard.BackgroundColor3 = C.card
		caseCard.Parent = shopScroll
		makeCorner(caseCard, 12)
		makeGradient(caseCard, Color3.fromRGB(42, 32, 40), C.card, 90)
		makeStroke(caseCard, 1.5, C.accent, 0.25)

		local caseIcon = Instance.new("ImageLabel")
		caseIcon.Size = UDim2.new(0, 85, 0, 85)
		caseIcon.Position = UDim2.new(0.5, 0, 0, 10)
		caseIcon.AnchorPoint = Vector2.new(0.5, 0)
		caseIcon.BackgroundTransparency = 1
		caseIcon.Image = "rbxassetid://298260830"
		caseIcon.Parent = caseCard

		local caseName = Instance.new("TextLabel")
		caseName.Size = UDim2.new(1, -10, 0, 24)
		caseName.Position = UDim2.new(0, 5, 0, 100)
		caseName.BackgroundTransparency = 1
		caseName.Font = Enum.Font.GothamBold
		caseName.TextSize = 17
		caseName.TextColor3 = C.white
		caseName.Text = "WEAPON CASE"
		caseName.Parent = caseCard

		local caseDesc = Instance.new("TextLabel")
		caseDesc.Size = UDim2.new(1, -16, 0, 32)
		caseDesc.Position = UDim2.new(0, 8, 0, 127)
		caseDesc.BackgroundTransparency = 1
		caseDesc.Font = Enum.Font.Gotham
		caseDesc.TextSize = 11
		caseDesc.TextColor3 = C.gray
		caseDesc.TextWrapped = true
		caseDesc.Text = "Random weapon from the case"
		caseDesc.Parent = caseCard

		local openCaseBtn = Instance.new("TextButton")
		openCaseBtn.Size = UDim2.new(1, -10, 0, 36)
		openCaseBtn.Position = UDim2.new(0, 5, 1, -42)
		openCaseBtn.BackgroundColor3 = C.accentDim
		openCaseBtn.Font = Enum.Font.GothamBold
		openCaseBtn.TextSize = 14
		openCaseBtn.TextColor3 = C.white
		openCaseBtn.Text = "OPEN CASE — 1000 $"
		openCaseBtn.Parent = caseCard
		makeCorner(openCaseBtn, 8)
		local caseBtnStroke = makeStroke(openCaseBtn, 1.5, C.accent, 0.2)
		playHover(openCaseBtn, caseBtnStroke)
		playClick(openCaseBtn)

		openCaseBtn.MouseButton1Click:Connect(function()
			if caseOpening then return end
			openCaseEvent:FireServer()
		end)
	end
'''

          s = s[:start] + case_block + s[end:]

          marker2 = 'buildShopItems = function()'
          insert_at = s.find(marker2)
          if insert_at == -1:
              raise SystemExit('buildShopItems marker not found')

          animation = r'''-- ==================== CASE OPENING CLIENT ====================
local caseOpening = false

openCaseEvent.OnClientEvent:Connect(function(data)
	if not data then return end

	if not data.success then
		if safeGetSetting('uiSounds', true) then errorSound:Play() end
		if _G.showNotification then
			local msg = data.reason == "NOT_ENOUGH_MONEY" and "Not enough money!" or "Case cannot be opened!"
			_G.showNotification(msg, C.red, 3)
		end
		return
	end

	if caseOpening then return end
	caseOpening = true

	local gui = Instance.new("ScreenGui")
	gui.Name = "CaseOpening"
	gui.ResetOnSpawn = false
	gui.IgnoreGuiInset = true
	gui.DisplayOrder = 600
	gui.Parent = playerGui

	local overlay = Instance.new("Frame")
	overlay.Size = UDim2.new(1, 0, 1, 0)
	overlay.BackgroundColor3 = Color3.fromRGB(0, 0, 0)
	overlay.BackgroundTransparency = 0.2
	overlay.Parent = gui

	local box = Instance.new("Frame")
	box.Size = UDim2.new(0, 700, 0, 260)
	box.Position = UDim2.new(0.5, 0, 0.5, 0)
	box.AnchorPoint = Vector2.new(0.5, 0.5)
	box.BackgroundColor3 = C.bg
	box.Parent = overlay
	makeCorner(box, 16)
	makeStroke(box, 2, C.accent, 0.2)

	local title = Instance.new("TextLabel")
	title.Size = UDim2.new(1, 0, 0, 38)
	title.Position = UDim2.new(0, 0, 0, 10)
	title.BackgroundTransparency = 1
	title.Font = Enum.Font.GothamBold
	title.TextSize = 21
	title.TextColor3 = C.white
	title.Text = "OPENING CASE..."
	title.Parent = box

	local reel = Instance.new("Frame")
	reel.Size = UDim2.new(1, -40, 0, 132)
	reel.Position = UDim2.new(0, 20, 0, 58)
	reel.BackgroundColor3 = Color3.fromRGB(9, 10, 14)
	reel.ClipsDescendants = true
	reel.Parent = box
	makeCorner(reel, 10)

	local center = Instance.new("Frame")
	center.Size = UDim2.new(0, 4, 1, 0)
	center.Position = UDim2.new(0.5, -2, 0, 0)
	center.BackgroundColor3 = C.accent
	center.ZIndex = 10
	center.Parent = reel

	local track = Instance.new("Frame")
	track.Size = UDim2.new(0, 6000, 1, 0)
	track.BackgroundTransparency = 1
	track.Parent = reel

	local layout = Instance.new("UIListLayout")
	layout.FillDirection = Enum.FillDirection.Horizontal
	layout.Padding = UDim.new(0, 8)
	layout.VerticalAlignment = Enum.VerticalAlignment.Center
	layout.Parent = track

	local names = {}
	for _, tool in ipairs(shopItemsFolder:GetChildren()) do
		if tool:IsA("Tool") then
			table.insert(names, tool.Name)
		end
	end

	if #names == 0 then
		gui:Destroy()
		caseOpening = false
		return
	end

	local winnerIndex = 38
	for i = 1, 50 do
		local name = (i == winnerIndex) and data.item or names[math.random(1, #names)]
		local source = shopItemsFolder:FindFirstChild(name)

		local card = Instance.new("Frame")
		card.Size = UDim2.new(0, 118, 0, 112)
		card.BackgroundColor3 = C.card
		card.Parent = track
		makeCorner(card, 8)
		makeStroke(card, i == winnerIndex and 2 or 1, i == winnerIndex and C.accent or C.white, i == winnerIndex and 0.1 or 0.7)

		local icon = Instance.new("ImageLabel")
		icon.Size = UDim2.new(0, 64, 0, 64)
		icon.Position = UDim2.new(0.5, 0, 0, 6)
		icon.AnchorPoint = Vector2.new(0.5, 0)
		icon.BackgroundTransparency = 1
		icon.Image = source and source.TextureId ~= "" and source.TextureId or "rbxassetid://298260830"
		icon.Parent = card

		local label = Instance.new("TextLabel")
		label.Size = UDim2.new(1, -8, 0, 32)
		label.Position = UDim2.new(0, 4, 1, -36)
		label.BackgroundTransparency = 1
		label.Font = Enum.Font.GothamBold
		label.TextSize = 11
		label.TextColor3 = C.white
		label.TextWrapped = true
		label.Text = name
		label.Parent = card
	end

	task.wait()
	local cardWidth = 118
	local gap = 8
	local targetX = -((winnerIndex - 1) * (cardWidth + gap)) + reel.AbsoluteSize.X / 2 - cardWidth / 2

	if safeGetSetting('uiSounds', true) then clickSound:Play() end
	local tween = TweenService:Create(track, TweenInfo.new(4.5, Enum.EasingStyle.Quint, Enum.EasingDirection.Out), {
		Position = UDim2.new(0, targetX, 0, 0)
	})
	tween:Play()
	tween.Completed:Wait()

	local resultName = Instance.new("TextLabel")
	resultName.Size = UDim2.new(1, -20, 0, 45)
	resultName.Position = UDim2.new(0, 10, 1, -55)
	resultName.BackgroundTransparency = 1
	resultName.Font = Enum.Font.GothamBold
	resultName.TextSize = 24
	resultName.TextColor3 = C.accent
	resultName.Text = "YOU GOT: " .. tostring(data.item)
	resultName.Parent = box

	title.Text = "CASE OPENED!"
	if safeGetSetting('uiSounds', true) then successSound:Play() end

	task.wait(2.5)
	gui:Destroy()
	caseOpening = false
end)

'''

          s = s[:insert_at] + animation + s[insert_at:]
          s = s.replace('-- ==================== CASE OPENING CLIENT ====================\n', '-- ==================== CASE OPENING CLIENT V2 ====================\n', 1)

          p.write_text(s, encoding='utf-8')
          print('Patched localscript.lua')
          PY

      - name: Commit patched LocalScript and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localscript.lua
          git commit -m "Apply case shop [case-done]" || exit 0
          git push
